# Held-out compound stress for the TWC environment (same pattern as the JSAC
# compound_eval.yaml); the capacity drop hits the satellite serving the most
# UEs when it starts, and the 18 dB blockage affects all links of 25% of UEs.
events:
  - type: traffic_burst
    start_step: 60
    duration_steps: 60
    severity: 2.5
    ue_fraction: 0.5
  - type: capacity_drop
    start_step: 80
    duration_steps: 50
    severity: 0.45
    satellite_selector: busiest
  - type: blockage
    start_step: 100
    duration_steps: 25
    severity: 18.0
    ue_fraction: 0.25
