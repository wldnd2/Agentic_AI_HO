# TWC environment: adjacent planes of a Starlink-like Walker shell
# (600 km = 3GPP LEO-600, 53 deg, 22 satellites per plane). Satellites that never become
# visible from the service region within an episode are omitted.
satellite:
  altitude_km: 600.0
  inclination_deg: 53.0
  orbital_period_s: auto
  constellation:
    type: walker_slice
    planes: 3
    sats_per_plane: 22
    raan_spacing_deg: 5.0
    random_epoch: true
    visibility_margin_deg: 5.0
    filter_horizon_s: 420.0         # episode length of the TWC experiments
