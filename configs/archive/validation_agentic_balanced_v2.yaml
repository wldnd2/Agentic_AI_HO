    start_step: 60
    duration_steps: 40
    severity: 12.0
    satellite_id: 2
    ue_fraction: 0.5

  - type: capacity_drop
    start_step: 130
    duration_steps: 50
    severity: 0.55
    satellite_id: 1

  - type: traffic_burst
    start_step: 200
    duration_steps: 50
    severity: 1.60
    ue_fraction: 0.5

  - type: blockage
    start_step: 280
    duration_steps: 40
    severity: 12.0
    satellite_id: 4
    ue_fraction: 0.5

  - type: capacity_drop
    start_step: 340
    duration_steps: 50
    severity: 0.60
    satellite_id: 5
