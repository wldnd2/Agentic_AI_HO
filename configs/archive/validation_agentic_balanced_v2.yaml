environment:
  num_ues: 12
  num_satellites: 6
  candidate_count: 3
  episode_steps: 420

satellite:
  bandwidth_mhz: 4.0
  capacity_scale: 0.70

traffic:
  mean_arrival_mbps: 2.0
  arrival_spread: 0.35

events:
